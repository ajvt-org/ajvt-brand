<!--
  THE OFFICIAL SEAL — الختم الرسمي

  Reproduced from the stamp already in use (ajvt-app/public/receipt-seal.svg).
  It is the ONLY mark drawn in seal navy rather than the brand palette, and that
  is deliberate: a sealed document must never be mistakable for a designed one.

  Do not restyle it, recolour it, or run it through the lockup engine. A stamp
  that changes appearance stops functioning as a stamp. If the Secretariat
  General ever adopts a new seal, replace this file wholesale and record the
  date it changed.

  The centre reads الأمانة العامة. Other organs get their own file rather than a
  variant of this one.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="ختم رابطة شباب قرية التاكلالت">
  <g fill="none" stroke="#2c4372">
    <circle cx="200" cy="200" r="192" stroke-width="7"/>
    <circle cx="200" cy="200" r="177" stroke-width="2.5"/>
    <circle cx="200" cy="200" r="113" stroke-width="2.5"/>
  </g>
  <g fill="#2c4372" font-family="Amiri, 'Noto Naskh Arabic', serif" font-weight="700">
    <text x="0" y="0" font-size="24" text-anchor="middle" transform="translate(294.49 83.50) rotate(399.04)">رابطة</text>
    <text x="0" y="0" font-size="24" text-anchor="middle" transform="translate(244.34 56.70) rotate(377.19)">شباب</text>
    <text x="0" y="0" font-size="24" text-anchor="middle" transform="translate(192.50 50.19) rotate(357.13)">قرية</text>
    <text x="0" y="0" font-size="24" text-anchor="middle" transform="translate(120.78 72.63) rotate(328.12)">التاكلالت</text>
    <text x="0" y="0" font-size="23" text-anchor="middle" transform="translate(260.04 329.79) rotate(-24.83)">خيرية</text>
    <text x="0" y="0" font-size="23" text-anchor="middle" transform="translate(200.00 343.00) rotate(0.00)">وحدة</text>
    <text x="0" y="0" font-size="23" text-anchor="middle" transform="translate(139.96 329.79) rotate(24.83)">تعاون</text>
    <text x="200" y="192" font-size="30" text-anchor="middle">الأمانة</text>
    <text x="200" y="230" font-size="30" text-anchor="middle">العامة</text>
  </g>
  <g fill="#2c4372">
    <circle cx="350.00" cy="200.00" r="4"/>
    <circle cx="50.00" cy="200.00" r="4"/>
  </g>
  <g stroke="#2c4372" stroke-width="2.5" stroke-linecap="round">
    <path d="M 148,150 H 252"/>
    <path d="M 148,248 H 252"/>
  </g>
</svg>
