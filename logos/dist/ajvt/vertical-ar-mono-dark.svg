6,-19.08L167.73,-21.67L167.73,0L162.86,0Z M182.58,-2.25Q182.58,0.64 181.41,2.77Q180.23,4.91 178.08,5.88Q176.67,6.55 175.02,6.55Q172.8,6.55 170.69,5.38L170.69,1.14Q172.44,2.12 174.08,2.12Q174.92,2.12 175.63,1.85Q177.68,1.14 177.68,-1.92L177.68,-12.5L182.58,-15.12L182.58,-2.25Z" fill="#1a3f33" transform="translate(74.27 26.88)"/>
