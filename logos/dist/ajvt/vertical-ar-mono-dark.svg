1.24,-56.53 252.92,-54.85Q254.6,-53.17 254.6,-50.32Q254.6,-47.38 252.92,-45.65Q251.24,-43.93 248.47,-43.93ZM262.5,-43.93Q259.64,-43.93 257.92,-45.7Q256.2,-47.46 256.2,-50.32Q256.2,-53.09 257.92,-54.81Q259.64,-56.53 262.5,-56.53Q265.27,-56.53 266.95,-54.85Q268.63,-53.17 268.63,-50.32Q268.63,-47.38 266.95,-45.65Q265.27,-43.93 262.5,-43.93ZM271.66,-11.76L279.8,-11.76L279.8,0L270.48,0Q264.6,0 260.74,-2.86Q256.7,0 250.91,0L241.5,0L241.5,-11.76L249.73,-11.76Q252.42,-11.76 253.51,-12.85Q254.6,-13.94 254.6,-16.63L254.6,-31.33L266.78,-37.8L266.78,-16.63Q266.78,-13.94 267.83,-12.85Q268.88,-11.76 271.66,-11.76Z M275.35,0L275.35,-11.76L280.81,-11.76Q284.34,-11.76 285.73,-13.23Q287.11,-14.7 287.11,-18.4L287.11,-47.71L299.29,-54.18L299.29,-18.31Q299.29,-9.74 294.08,-4.7Q289.3,0 281.4,0L275.35,0Z M314.41,0L314.41,-47.71L326.59,-54.18L326.59,0L314.41,0Z" fill="#1a3f33" transform="translate(0 122.64)"/>
    </g>
</svg>
