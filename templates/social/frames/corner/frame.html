<!--
  The Corner. Furniture for a match photograph: two marks in the top corners,
  the cup's name bottom-left, the association's endorsement bottom-right.

  NOTHING HERE IS OPAQUE except the marks and the type. The page renders on a
  transparent ground and the only wash is a gradient along the foot, so the
  photograph underneath is never covered — which is the whole point of a frame
  that is laid on rather than matted around.

  Every length is in cqw — 1% of the frame's own width — so one template serves
  every format and the furniture keeps its proportions at any export size.
-->
<div class="frame">
  <div class="haze"></div>
  <div class="keyline"></div>

  <span class="mk mk-cup">{{markCup}}</span>
  <span class="mk mk-ajvt">{{markAjvt}}</span>

  <div class="sign">
    <div class="tick"></div>
    <div class="name" dir="rtl">{{name}}</div>
    <div class="sub" dir="rtl">{{season}}</div>
  </div>

  <div class="org" dir="rtl">{{org}}</div>
</div>
